name: release

# Pushing a tag such as v0.2.0 creates the GitHub Release with generated notes and
# attaches kindle-monitor-kindle.zip: the files that go to /mnt/us on the Kindle
# (emergency.sh, documents/ and kindle-monitor/), without the tests.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    permissions:
      contents: write
    uses: brno01/.github/.github/workflows/release.yml@v1
    with:
      build-command: cd kindle && zip -r -X ../kindle-monitor-kindle.zip emergency.sh documents kindle-monitor
      assets: kindle-monitor-kindle.zip
